; Open firmware for the Andivi ANDRTF3/MD (STM32L071RBT6, minimal PT1000 variant)
;
;   pio run              builds the bootloader and the firmware for both slots
;   boot     -> .pio/build/boot/firmware.bin      flash at 0x08000000 (SWD, once)
;   slot_a   -> .pio/build/slot_a/andrtf3_slot_a.bin  flash at 0x08002000 (SWD) or update over Modbus
;   slot_b   -> .pio/build/slot_b/andrtf3_slot_b.bin  update over Modbus only
; See README.md before flashing (original firmware backup + restore procedure).

[platformio]
default_envs = boot, slot_a, slot_b

[common]
platform = ststm32
board = andrtf3_l071rb
framework = stm32cube
build_flags =
    -Wall -Wextra
    -Os
    -Iinclude
upload_protocol = stlink
debug_tool = stlink

[env:boot]
extends = common
board_build.ldscript = ld/boot.ld
board_upload.maximum_size = 8192
build_src_filter = +<boot/> +<nvm.c> +<bootrec.c> +<debug.c> +<board.c> +<system.c>
build_flags = ${common.build_flags} -DBOOTLOADER

[env:slot_a]
extends = common
board_build.ldscript = ld/slot_a.ld
board_upload.maximum_size = 57340   ; slot minus the CRC word (image_valid)
board_upload.offset_address = 0x08002000
build_src_filter = +<*> -<boot/>
build_flags = ${common.build_flags} -DAPP_SLOT=0 -DUSER_VECT_TAB_ADDRESS -DVECT_TAB_OFFSET=0x2000
extra_scripts = post:../tools/post_image.py

[env:slot_b]
extends = common
board_build.ldscript = ld/slot_b.ld
board_upload.maximum_size = 57340   ; slot minus the CRC word (image_valid)
board_upload.offset_address = 0x08010000
build_src_filter = +<*> -<boot/>
build_flags = ${common.build_flags} -DAPP_SLOT=1 -DUSER_VECT_TAB_ADDRESS -DVECT_TAB_OFFSET=0x10000
extra_scripts = post:../tools/post_image.py
